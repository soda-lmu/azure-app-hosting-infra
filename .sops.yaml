# Keys that encrypt config.sops.env (shared/sops/README.md). Encrypting needs all of them,
# decrypting any one.
#  1. Azure Key Vault key (default), from shared/sops/deploy.sh: members of PG_ENTRA_ADMIN_GROUP
#     may use it, via `az login`. No version in the URL: sops uses the latest.
#  2. age, post-quantum (age-keygen -pq), only as a backup, e.g. if the vault is deleted. Keep its
#     private key offline. Why post-quantum: https://words.filippo.io/right-answers/#asymmetric-encryption
# After changing a key here: sops updatekeys config.sops.env
creation_rules:
  - path_regex: (^|/)config\.sops\.env$
    azure_keyvault: https://kv-sops-wgdqozhqtf7wg.vault.azure.net/keys/sops-config
    age: >-
      

