# LiteLLM proxy config. Holds no secrets: keys come from env vars set in main.bicep.
# Deployed as a Container Apps secret (loadTextContent in main.bicep), mounted at /mnt/secrets/litellm-config.
model_list:
  - model_name: text-embedding-ada-002
    litellm_params:
      model: azure/text-embedding-ada-002   # azure/<deployment-name>; priced from LiteLLM's table
      api_base: os.environ/AZURE_API_BASE
      api_version: "v1"
      api_key: os.environ/AZURE_API_KEY
  - model_name: gpt-6-luna
    litellm_params:
      model: azure/gpt-6-luna        # azure/<deployment-name>; priced from LiteLLM's table
      api_base: os.environ/AZURE_API_BASE   # resource root; LiteLLM appends /openai/v1/
      api_version: "v1"              # Azure OpenAI v1 API
      api_key: os.environ/AZURE_API_KEY
      # If the deployment name isn't a known model, or your price differs, set it explicitly:
      # input_cost_per_token: 0.0000001
      # output_cost_per_token: 0.0000005
  - model_name: gpt-6-sol
    litellm_params:
      model: azure/gpt-6-sol               # azure/<deployment-name>; priced from LiteLLM's table
      api_base: os.environ/AZURE_API_BASE
      api_version: "v1"
      api_key: os.environ/AZURE_API_KEY
  - model_name: DeepSeek-V4-Flash-0731
    litellm_params:
      # azure_ai/ (Azure AI Foundry provider), not azure/: LiteLLM's price table lists this model
      # there, and only that way are requests charged. Same resource, endpoint and key as above.
      model: azure_ai/DeepSeek-V4-Flash-0731   # azure_ai/<deployment-name>
      api_base: os.environ/AZURE_AI_API_BASE   # AZURE_API_BASE + /openai/v1, set in main.bicep
      api_key: os.environ/AZURE_API_KEY
  - model_name: gpt-oss-120b
    litellm_params:
      model: azure_ai/gpt-oss-120b         # priced only under azure_ai/, like DeepSeek above
      api_base: os.environ/AZURE_AI_API_BASE
      api_key: os.environ/AZURE_API_KEY

litellm_settings:
  # Without an API key (as in Azure: AZURE_API_KEY isn't set there), LiteLLM gets Entra tokens for
  # Azure AI through the managed identity (AZURE_CREDENTIAL, AZURE_CLIENT_ID) and renews them.
  # Locally, with AZURE_API_KEY from .env, the key is used instead.
  enable_azure_ad_token_refresh: true

general_settings:
  # Never store prompts and responses in the spend logs (LiteLLM's default, made explicit: set
  # here, the admin UI can't switch it on, because the config takes precedence over the database).
  store_prompts_in_spend_logs: false
  # Delete per-request spend logs older than 90 days (checked daily). Budgets are unaffected:
  # they use the running totals on keys/users/teams, and the daily summaries are kept.
  maximum_spend_logs_retention_period: "90d"
  maximum_spend_logs_retention_interval: "1d"
