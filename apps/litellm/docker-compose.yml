# Local test with the same image and config as Azure: docker compose up -d
# Reads AZURE_API_BASE and AZURE_API_KEY from .env next to this file (see .env.example).
# Postgres here stands in for the shared server (same per-app role/database layout).
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: local
      POSTGRES_DB: litellm_db
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "litellm"]
      interval: 2s
      retries: 30

  litellm:
    image: ghcr.io/berriai/litellm-database:v1.105.0
    command: ["--config", "/mnt/secrets/litellm-config", "--port", "4000"]
    ports: ["4000:4000"]
    volumes:
      - ./config.yaml:/mnt/secrets/litellm-config:ro
    environment:
      DATABASE_URL: postgresql://litellm:local@postgres:5432/litellm_db
      LITELLM_MASTER_KEY: sk-local-test
      LITELLM_SALT_KEY: local-test-salt
      # No fallbacks: fail at startup instead of sending requests with a placeholder key.
      AZURE_API_BASE: ${AZURE_API_BASE:?set it in apps/litellm/.env (see .env.example)}
      AZURE_AI_API_BASE: ${AZURE_API_BASE:?set it in apps/litellm/.env (see .env.example)}/openai/v1
      AZURE_API_KEY: ${AZURE_API_KEY:?set it in apps/litellm/.env (see .env.example)}
    depends_on:
      postgres: { condition: service_healthy }
