# Local test with the same image and config as Azure. Compose only reads a .env next to
# this file, so point it at the repo's .env:  docker compose --env-file ../../.env up -d
# Postgres here stands in for the shared server (same per-app role/database layout).
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: local
      POSTGRES_DB: litellm_db
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "litellm"]
      interval: 2s
      retries: 30

  litellm:
    image: ghcr.io/berriai/litellm-database:v1.104.0
    command: ["--config", "/mnt/secrets/litellm-config", "--port", "4000"]
    ports: ["4000:4000"]
    volumes:
      - ./config.yaml:/mnt/secrets/litellm-config:ro
    environment:
      DATABASE_URL: postgresql://litellm:local@postgres:5432/litellm_db
      LITELLM_MASTER_KEY: sk-local-test
      LITELLM_SALT_KEY: local-test-salt
      # No fallbacks: fail at startup instead of sending requests with a placeholder key.
      AZURE_API_BASE: ${AZURE_API_BASE:?run with --env-file ../../.env}
      AZURE_AI_API_BASE: ${AZURE_API_BASE:?run with --env-file ../../.env}/openai/v1
      AZURE_API_KEY: ${AZURE_API_KEY:?run with --env-file ../../.env}
    depends_on:
      postgres: { condition: service_healthy }
