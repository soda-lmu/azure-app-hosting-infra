# Deploys apps/litellm/main.bicep when it (or config.yaml) changes on main, e.g. after Renovate
# merged a LiteLLM update. Logs in to Azure via OIDC: the federated credential only trusts the
# "litellm-production" environment, which only accepts main. GitHub holds no credentials: the
# environment secrets below are only identifiers and addresses, kept as secrets so logs mask them.
# If the new revision isn't healthy, it redeploys the previously running commit and opens an
# issue assigned to NOTIFY_USER, default the repo owner (the failed run itself only notifies
# whoever triggered it, which for automatic merges is the Renovate bot).
name: LiteLLM Deploy

on:
  push:
    branches: [main]
    paths: ['apps/litellm/**', '.github/workflows/litellm-deploy.yml']
  workflow_dispatch:

concurrency:
  group: litellm-deploy-production
  cancel-in-progress: false

permissions:
  id-token: write # OIDC login to Azure
  contents: read
  issues: write   # rollback notification

jobs:
  litellm-deploy:
    runs-on: ubuntu-latest
    environment: litellm-production
    env: # Environment secrets of litellm-production (same values as config.sops.yaml), printed by apps/litellm/deploy.sh
      PG_HOST: ${{ secrets.PG_HOST }}
      AZURE_API_BASE: ${{ secrets.AZURE_API_BASE }}
      DEPLOYED_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # history, to roll back to an earlier commit

      - name: Load resource names (apps/litellm/names.bicep)
        run: |
          az bicep build -f apps/litellm/names.bicep --stdout |
            jq -r '.variables.names | "LITELLM_APP_RG=\(.appResourceGroup)\nLITELLM_CONTAINERAPP=\(.containerApp)\nLITELLM_ENV=\(.containerAppEnvironment)\nLITELLM_CERT=\(.customDomainCertificate)"' >> "$GITHUB_ENV"

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.LITELLM_GITHUB_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The custom domain's certificate is created by apps/litellm/deploy.sh (admin). Until it's
      # issued, deploy without the domain instead of failing. Runs before anything is deployed:
      # if Azure can't be asked, the job stops here rather than guess (which could remove the domain).
      - name: Custom domain stage (apps/litellm/domain-stage.sh)
        run: |
          out=$(apps/litellm/domain-stage.sh)
          read -r stage reason <<< "$out"
          [[ $stage != none ]] ||
            echo "::warning::Custom domain not ready (certificate $LITELLM_CERT: $reason): deploying without it. Run apps/litellm/deploy.sh."
          echo "LITELLM_CUSTOM_DOMAIN_STAGE=$stage" >> "$GITHUB_ENV"

      - name: Remember the running commit
        id: before
        run: |
          commit=$(az containerapp show -n "$LITELLM_CONTAINERAPP" -g "$LITELLM_APP_RG" --query tags.commit -o tsv 2>/dev/null || true)
          # Fall back to the previous main if the running one isn't a known commit (e.g. "-dirty").
          # rev-parse turns the tag (set in Azure, so untrusted) into a plain commit hash.
          commit=$(git rev-parse -q --verify --end-of-options "${commit}^{commit}") || commit=${{ github.event.before }}
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Running before deploy: $commit"

      - name: Deploy main.bicep
        working-directory: apps/litellm
        run: az deployment group create -g "$LITELLM_APP_RG" -n litellm -p main.bicepparam -o none

      - name: Health check of the new revision
        run: |
          for _ in $(seq 60); do # up to 10 minutes
            read -r latest ready fqdn <<< "$(az containerapp show -n "$LITELLM_CONTAINERAPP" -g "$LITELLM_APP_RG" \
              --query "[properties.latestRevisionName, properties.latestReadyRevisionName, properties.configuration.ingress.fqdn]" -o tsv | xargs)"
            # Ready must be the *new* revision; otherwise the old one may still be answering.
            if [[ $latest == "$ready" ]] && curl -sf "https://$fqdn/health/readiness" | jq -e '.db == "connected"' > /dev/null; then
              echo "Revision $latest is healthy"; exit 0
            fi
            sleep 10
          done
          echo "::error::Revision $latest did not become healthy"; exit 1

      - name: Roll back to the previously running commit
        id: rollback
        if: failure() && steps.before.outputs.commit != ''
        env:
          DEPLOYED_COMMIT: ${{ steps.before.outputs.commit }}
        run: |
          git checkout "$DEPLOYED_COMMIT" -- apps/litellm
          cd apps/litellm
          LITELLM_APP_RG=$(az bicep build -f names.bicep --stdout | jq -r .variables.names.appResourceGroup)
          out=$(./domain-stage.sh)
          export LITELLM_CUSTOM_DOMAIN_STAGE=${out%% *}
          az deployment group create -g "$LITELLM_APP_RG" -n litellm -p main.bicepparam -o none
          echo "::error::Rolled back to $DEPLOYED_COMMIT"

      - name: Notify
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLBACK_COMMIT: ${{ steps.before.outputs.commit }}
        run: |
          gh issue create --repo "${{ github.repository }}" --assignee "${{ vars.NOTIFY_USER || github.repository_owner }}" \
            --title "Deploy of ${GITHUB_SHA::7} failed" \
            --body "The deploy of ${{ github.sha }} failed (see the run).
          Rollback to \`$ROLLBACK_COMMIT\`: ${{ steps.rollback.outcome }}.
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          main still contains the failed change: revert it, or fix it forward."
