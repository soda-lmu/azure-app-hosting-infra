# Shared PostgreSQL: checks the server's Bicep on every PR. Required status check in the main
# ruleset, so no path filter (a required check that doesn't run would block the PR).
# Deploying the shared server stays manual (shared/postgres/deploy.sh, admins only).
name: Shared PostgreSQL CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  postgres-bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint and build Bicep
        env: # dummy values; main.bicepparam reads these
          PG_SERVER: ci
          PG_ADMIN_USER: ci
          PG_ADMIN_PASSWORD: ci
          ADMIN_GROUP_ID: 00000000-0000-0000-0000-000000000000
          ADMIN_CLIENT_IP: 192.0.2.1
        run: |
          az bicep install
          for f in $(git ls-files 'shared/postgres/*.bicep'); do
            az bicep lint --file "$f"
            az bicep build --file "$f" --stdout > /dev/null
          done
          az bicep build-params --file shared/postgres/main.bicepparam --stdout > /dev/null
