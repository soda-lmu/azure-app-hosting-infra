# Shared PostgreSQL and SOPS Key Vault (shared/): checks their Bicep on every PR. Required status
# check in the main ruleset, so no path filter (a required check that doesn't run would block the PR).
# Deploying them stays manual (mise run deploy:postgres / deploy:sops, admins only).
name: Shared PostgreSQL CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  postgres-bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Lint and build Bicep
        env: # dummy values; main.bicepparam reads these
          PG_INSTANCE_NAME: ci
          PG_ADMIN_USER: ci
          PG_ADMIN_PASSWORD: ci
          ADMIN_GROUP_ID: 00000000-0000-0000-0000-000000000000
          ADMIN_CLIENT_IP: 192.0.2.1
          BUDGET_ALERT_EMAILS: ci@example.invalid
        run: |
          az bicep install
          for f in $(git ls-files 'shared/*.bicep'); do
            az bicep lint --file "$f"
            az bicep build --file "$f" --stdout > /dev/null
          done
          for f in $(git ls-files 'shared/*.bicepparam'); do
            az bicep build-params --file "$f" --stdout > /dev/null
          done
